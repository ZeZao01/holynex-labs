<!-- @dsCard group="Colors" viewport="700x170" name="Status colors" subtitle="Success · warning · danger · info — soft bg + strong fg pairs" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-ui);color:var(--text-primary)}.r{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:12px}.n{font:600 12px var(--font-ui);margin-top:8px}.v{font:400 11px var(--font-numeric);color:var(--text-secondary);margin-top:2px}.t{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.dot{width:28px;height:28px;border-radius:50%}.p{display:inline-flex;align-self:flex-start;height:22px;padding:0 8px;border-radius:999px;align-items:center;font:600 11.5px var(--font-ui)}</style></head><body><div class="t"><div class="c" style="background:var(--success-50)"><div class="dot" style="background:var(--success-500)"></div><span class="p" style="background:#fff;color:var(--success-700)">Concluído</span><div class="v">--success-50 / 500 / 700</div></div><div class="c" style="background:var(--warning-50)"><div class="dot" style="background:var(--warning-500)"></div><span class="p" style="background:#fff;color:var(--warning-700)">Pendente</span><div class="v">--warning-50 / 500 / 700</div></div><div class="c" style="background:var(--danger-50)"><div class="dot" style="background:var(--danger-500)"></div><span class="p" style="background:#fff;color:var(--danger-700)">Falhou</span><div class="v">--danger-50 / 500 / 700</div></div><div class="c" style="background:var(--info-50)"><div class="dot" style="background:var(--info-500)"></div><span class="p" style="background:#fff;color:var(--info-700)">Em análise</span><div class="v">--info-50 / 500 / 700</div></div></div></body></html>
