<!-- @dsCard group="Spacing" viewport="700x140" name="Motion" subtitle="Quick, damped ease-out; no bounce" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-ui);color:var(--text-primary)}.r{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:12px}.n{font:600 12px var(--font-ui);margin-top:8px}.v{font:400 11px var(--font-numeric);color:var(--text-secondary);margin-top:2px}.m{flex:1;border:1px solid var(--border-subtle);border-radius:12px;padding:12px}.bar{height:6px;border-radius:6px;background:var(--neutral-100);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;animation:go 1.8s var(--ease-out) infinite}@keyframes go{from{width:0}60%,to{width:100%}}</style></head><body><div class="r" style="gap:12px"><div class="m"><div class="n" style="margin:0">--dur-fast · 120ms</div><div class="v">hover, press, color</div><div class="bar"><i style="animation-duration:1.2s"></i></div></div><div class="m"><div class="n" style="margin:0">--dur-base · 180ms</div><div class="v">tabs, switches, fades</div><div class="bar"><i></i></div></div><div class="m"><div class="n" style="margin:0">--dur-slow · 280ms</div><div class="v">drawer, dialog, sheet</div><div class="bar"><i style="animation-duration:2.4s"></i></div></div><div class="m"><div class="n" style="margin:0">--ease-out</div><div class="v">cubic-bezier(.2,.8,.2,1)</div><div class="v">press: scale(.98)</div></div></div></body></html>
