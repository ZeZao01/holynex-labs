<!-- @dsCard group="Colors" viewport="700x240" name="Surfaces & text" subtitle="Semantic aliases in use: canvas → card → sunken tile" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-ui);color:var(--text-primary)}.r{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:12px}.n{font:600 12px var(--font-ui);margin-top:8px}.v{font:400 11px var(--font-numeric);color:var(--text-secondary);margin-top:2px}body{background:var(--bg-canvas)}.card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--surface-sunken);border-radius:12px;padding:12px}.k{font:400 11px var(--font-numeric);color:var(--text-tertiary)}</style></head><body><div class="card"><div><div style="font:600 16px var(--font-ui)">--text-primary</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px">--text-secondary · descrições e rótulos</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:4px">--text-tertiary · eixos, placeholders</div><div style="font-size:13px;color:var(--text-brand);margin-top:8px;font-weight:600">--text-brand · links e destaques</div></div><div class="tile"><div class="k">--surface-sunken (inside a card)</div><div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1;height:40px;border-radius:10px;background:var(--surface-inverse)"></div><div style="flex:1;height:40px;border-radius:10px;background:var(--surface-brand)"></div><div style="flex:1;height:40px;border-radius:10px;background:var(--surface-brand-soft)"></div></div><div class="k" style="margin-top:6px">inverse · brand · brand-soft</div></div></div><div class="k" style="margin-top:10px">--bg-canvas (page) · --surface-card + --border-subtle (card, 16px radius)</div></body></html>
