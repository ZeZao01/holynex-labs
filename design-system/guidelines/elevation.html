<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-ui);color:var(--text-primary)}.r{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:12px}.n{font:600 12px var(--font-ui);margin-top:8px}.v{font:400 11px var(--font-numeric);color:var(--text-secondary);margin-top:2px}body{background:var(--bg-canvas)}.e{flex:1;height:80px;background:#fff;border-radius:14px;display:flex;align-items:flex-end;padding:10px;font:400 11px var(--font-numeric);color:var(--text-secondary)}</style></head><body><div class="r" style="gap:14px"><div class="e" style="border:1px solid var(--border-subtle)">border-subtle<br>(cards)</div><div class="e" style="box-shadow:var(--shadow-xs)">shadow-xs<br>(active nav)</div><div class="e" style="box-shadow:var(--shadow-sm)">shadow-sm<br>(seg. tab)</div><div class="e" style="box-shadow:var(--shadow-md)">shadow-md<br>(toast, tip)</div><div class="e" style="box-shadow:var(--shadow-lg)">shadow-lg<br>(dialog)</div><div class="e" style="background:var(--accent);color:#fff;box-shadow:var(--shadow-brand)">shadow-brand<br>(AI fab)</div></div></body></html>
